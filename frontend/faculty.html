<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Faculty – Admin Dashboard</title>

<!-- THREE + VANTA -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.birds.min.js"></script>

<style>
    body {
        margin: 0;
        font-family: Arial, sans-serif;
        color: #fff;
        background: #0d1117;
    }

    #vanta-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: -1;
    }

    .container {
        width: 90%;
        margin: auto;
        padding-top: 40px;
    }

    h1 {
        text-align: center;
        margin-bottom: 25px;
        font-size: 34px;
        text-shadow: 0 0 15px #ff4df0;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        background: rgba(0,0,0,0.55);
        border-radius: 12px;
        overflow: hidden;
        -webkit-backdrop-filter: blur(6px);
        backdrop-filter: blur(6px);
        margin-bottom: 20px;
    }

    th, td {
        padding: 14px;
        border-bottom: 1px solid rgba(255,255,255,0.1);
        text-align: left;
    }

    th {
        background: rgba(0,0,0,0.75);
        font-size: 16px;
    }

    tr:hover {
        background: rgba(255, 77, 240, 0.1);
    }

    .action-btn {
        padding: 6px 12px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        color: white;
        margin-right: 5px;
    }

    .delete-btn { background: #ff4d4d; }
    .delete-btn:hover { background: #ff1a1a; }

    .edit-btn { background: #4da6ff; }
    .edit-btn:hover { background: #1a8cff; }

    .add-btn { background: #28a745; margin-bottom: 15px; }
    .add-btn:hover { background: #1e7e34; }

    /* Modal */
    .modal {
        display: none;
        position: fixed;
        z-index: 10;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        overflow: auto;
        background-color: rgba(0,0,0,0.75);
        -webkit-backdrop-filter: blur(4px);
        backdrop-filter: blur(4px);
    }

    .modal-content {
        background-color: #111;
        margin: 10% auto;
        padding: 20px;
        border-radius: 10px;
        width: 400px;
    }

    .modal-content input {
        width: 100%;
        padding: 8px;
        margin-bottom: 10px;
        border-radius: 5px;
        border: none;
    }

    .modal-content button {
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        color: white;
        font-weight: bold;
    }

    .save-btn { background: #28a745; }
    .save-btn:hover { background: #1e7e34; }
    .close-btn { background: #dc3545; margin-top: 10px; }
    .close-btn:hover { background: #a71d2a; }

</style>
</head>
<body>

<div id="vanta-bg"></div>

<div class="container">
    <h1>Faculty Management</h1>

    <button class="add-btn action-btn" onclick="openModal()">➕ Add Teacher</button>

    <table id="facultyTable">
        <tr>
            <th>Name</th>
            <th>Subject</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Action</th>
        </tr>
    </table>
</div>

<!-- Modal for Add/Edit -->
<div id="teacherModal" class="modal">
    <div class="modal-content">
        <h2 id="modalTitle">Add Teacher</h2>
        <input type="text" id="name" placeholder="Full Name" required>
        <input type="text" id="subject" placeholder="Subject" required>
        <input type="email" id="email" placeholder="Email" required>
        <input type="text" id="phone" placeholder="Phone Number" required>
        <input type="text" id="photoUrl" placeholder="Photo URL">
        <button class="save-btn" onclick="saveTeacher()">Save</button>
        <button class="close-btn" onclick="closeModal()">Cancel</button>
    </div>
</div>

<script>
// VANTA DARK BIRDS EFFECT
VANTA.BIRDS({
    el: "#vanta-bg",
    backgroundAlpha: 0,
    color1: 0xff4df0,
    color2: 0xffffff,
    birdSize: 1.2,
    quantity: 3,
    speedLimit: 3,
    cohesion: 20,
    alignment: 25,
    separation: 40
});

let editingId = null;

// Open Modal
function openModal(teacher = null) {
    document.getElementById('teacherModal').style.display = 'block';
    if (teacher) {
        editingId = teacher._id;
        document.getElementById('modalTitle').innerText = 'Edit Teacher';
        document.getElementById('name').value = teacher.name;
        document.getElementById('subject').value = teacher.subject;
        document.getElementById('email').value = teacher.email;
        document.getElementById('phone').value = teacher.phone;
    } else {
        editingId = null;
        document.getElementById('modalTitle').innerText = 'Add Teacher';
        document.getElementById('name').value = '';
        document.getElementById('subject').value = '';
        document.getElementById('email').value = '';
        document.getElementById('phone').value = '';
    }
}

// Close Modal
function closeModal() {
    document.getElementById('teacherModal').style.display = 'none';
}

// Load Faculty Table
async function loadFaculty() {
    try {
        const res = await fetch('http://localhost:5000/api/faculty');
        const data = await res.json();

        const table = document.getElementById('facultyTable');
        table.innerHTML = `
            <tr>
                <th>Name</th>
                <th>Subject</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Action</th>
            </tr>
        `;

        data.forEach(f => {
            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${f.name}</td>
                <td>${f.subject}</td>
                <td>${f.email}</td>
                <td>${f.phone}</td>
                <td>
                    <button class="action-btn edit-btn" onclick='openModal(${JSON.stringify(f)})'>Edit</button>
                    <button class="action-btn delete-btn" onclick="deleteFaculty('${f._id}')">Delete</button>
                </td>
            `;
            table.appendChild(row);
        });
    } catch (err) {
        console.error(err);
    }
}

// Save Teacher (Add or Update)
async function saveTeacher() {
    const name = document.getElementById('name').value;
    const subject = document.getElementById('subject').value;
    const email = document.getElementById('email').value;
    const phone = document.getElementById('phone').value;

    const payload = { name, subject, email, phone };

    try {
        if (editingId) {
            // Update teacher
            await fetch(`http://localhost:5000/api/faculty/${editingId}`, {
                method: 'PUT',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
        } else {
            // Add new teacher
            await fetch('http://localhost:5000/api/faculty', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
        }

        closeModal();
        loadFaculty();
    } catch(err) {
        console.error(err);
        alert('Failed to save teacher');
    }
}

// Delete Faculty
async function deleteFaculty(id) {
    if (!confirm('Are you sure you want to delete this teacher?')) return;
    try {
        await fetch(`http://localhost:5000/api/faculty/${id}`, { method: 'DELETE' });
        loadFaculty();
    } catch(err) {
        console.error(err);
        alert('Failed to delete teacher');
    }
}

// Initial Load
loadFaculty();

</script>
</body>
</html>
